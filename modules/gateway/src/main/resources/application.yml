server:
  port: 8080

spring:
  config:
    # 비밀값(JWT_SECRET, SEOUL_API_KEY 등)은 프로젝트 루트 .env(git 제외)에서 읽는다.
    # bootRun 은 모듈 디렉터리, IDE 는 프로젝트 루트에서 실행되므로 두 위치를 모두 둔다.
    # 컨테이너에는 .env 가 없고(optional) compose 가 환경변수로 주입한다 — 환경변수가 이 파일보다 우선한다.
    import: "optional:file:.env[.properties],optional:file:../../.env[.properties]"
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      # Spring Cloud Gateway 5.x (spring-cloud-starter-gateway-server-webflux)
      # GatewayProperties prefix 변경: spring.cloud.gateway → spring.cloud.gateway.server.webflux
      server:
        webflux:
          # CORS 는 CorsConfig(Spring Security CorsWebFilter)가 경로별로 처리한다.
          # Security 필터가 라우팅보다 먼저 실행되어 허용되지 않은 origin 을 여기서 거부하므로,
          # 이전의 globalcors('[/**]' 전체 허용)는 경로별 제한과 어긋나 제거했다.
          routes:
            # internal 경로 차단 — 게이트웨이 외부에서 내부 전용 API 호출 방지.
            # 모든 서비스의 S2S API 는 /api/v1/internal/{service}/** 규약을 따른다.
            # 지금은 이 경로로 가는 라우트가 없지만, 넓은 라우트가 추가돼도 열리지 않게 먼저 선언해 둔다.
            - id: block-internal
              uri: no://op
              predicates:
                - Path=/api/v1/internal/**
              filters:
                - SetStatus=403

            # 관리자 API — JwtAuthenticationFilter 가 required-audience 메타데이터를 보고
            # 관리자 카테고리 + 관리자 사이트(aud=ADMIN) 토큰만 통과시킨다. iam-service 보다 먼저 선언한다.
            - id: iam-admin
              uri: ${IAM_SERVICE_URL:http://localhost:8181}
              predicates:
                - Path=/api/v1/admin/**
              metadata:
                required-audience: ADMIN

            - id: iam-service
              uri: ${IAM_SERVICE_URL:http://localhost:8181}
              predicates:
                - Path=/api/v1/auth/**, /api/v1/member/**

            - id: stop-service
              uri: ${STOP_SERVICE_URL:http://localhost:8182}
              predicates:
                - Path=/api/v1/stop/**

            - id: reservation-service
              uri: ${RESERVATION_SERVICE_URL:http://localhost:8183}
              predicates:
                - Path=/api/v1/reservation/**, /api/v1/contract/**

hig:
  bulkhead:
    database-name: orderDatabase # 사용하지 않지만 공통설정으로 인한 추가 설정

# JWT 설정 (auth 서비스와 동일한 secret을 사용해야 합니다)
# 운영 환경에서는 반드시 AWS Secrets Manager 또는 환경변수로 주입해야 합니다.
jwt:
  secret: ${JWT_SECRET}

rest:
  service:
    apply-patterns: /health-check