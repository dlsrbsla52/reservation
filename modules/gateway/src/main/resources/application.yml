server:
  port: 8080

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8181
          predicates:
            - Path=/api/v1/auth/**
        - id: member-service
          uri: http://member-service:8182
          predicates:
            - Path=/api/v1/member/**
        - id: reservation-service
          uri: http://reservation-service:8183
          predicates:
            - Path=/api/v1/reservation/**

# JWT 설정 (auth 서비스와 동일한 secret을 사용해야 합니다)
# 운영 환경에서는 반드시 AWS Secrets Manager 또는 환경변수로 주입해야 합니다.
jwt:
  secret: ${JWT_SECRET:local-dev-dummy-jwt-secret-for-tests-only-0000000000}

rest:
  service:
    apply-patterns: /health-check