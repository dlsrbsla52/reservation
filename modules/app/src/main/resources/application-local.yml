spring:
  datasource:
    hikari:
      maximum-pool-size: 10
  exposed:
    # show-sql: true 사용 금지 — StdOutSqlLogger가 println으로 Log4j2를 우회한다.
    # SQL 로그는 common의 ExposedSqlLoggingInterceptor가 Exposed 로거(DEBUG)로 출력하므로
    # 아래 logging.level.Exposed 로 제어한다.
    show-sql: false

# Exposed SQL 로그 (local 전용). ExposedSqlLoggingInterceptor가 'Exposed' 로거 DEBUG로 출력.
logging:
  level:
    Exposed: debug
    # 성공 요청도 req/res 본문을 기록한다. 비밀번호·토큰 마스킹과 길이 제한은 필터에서 적용한다.
    com.media.bus.common.logging.AccessLoggingFilter: debug

resilience4j:
  bulkhead:
    instances:
      orderDatabase:
        maxConcurrentCalls: 9 # 풀 크기(10) - 1. 예전 local 은 풀 10·퍼밋 10 이라 규칙과 달랐다
        maxWaitDuration: 300ms

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# 로컬 확인용 이미지 저장소: docker-compose-local.yml 의 rustfs(버킷 bus-content, 공개 읽기). 운영은 R2 를 쓴다.
# 운영 .env 의 CONTENT_STORAGE_* 는 읽지 않는다 — local 프로필이 운영 R2 에 붙는 사고를 막으려고 LOCAL_CONTENT_STORAGE_* 만 읽는다.
# 접속 키 기본값은 로컬 RustFS 전용 더미 값이다(운영 R2 에서는 동작하지 않는다).
content:
  storage:
    endpoint: ${LOCAL_CONTENT_STORAGE_ENDPOINT:http://localhost:9000}
    presign-endpoint: ${LOCAL_CONTENT_STORAGE_PRESIGN_ENDPOINT:}
    access-key: ${LOCAL_CONTENT_STORAGE_ACCESS_KEY:local-only-access-key}
    secret-key: ${LOCAL_CONTENT_STORAGE_SECRET_KEY:local-only-secret-key}
    region: us-east-1
    bucket: bus-content
    public-base-url: ${LOCAL_CONTENT_STORAGE_PUBLIC_BASE_URL:http://localhost:9000/bus-content}
    path-style: true

# 로컬에서는 Swagger UI 를 8080 에서 연다
app:
  security:
    expose-api-docs: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
