server:
  port: 8183

spring:
  config:
    # 비밀값(JWT_SECRET, SEOUL_API_KEY 등)은 프로젝트 루트 .env(git 제외)에서 읽는다.
    # bootRun 은 모듈 디렉터리, IDE 는 프로젝트 루트에서 실행되므로 두 위치를 모두 둔다.
    # 컨테이너에는 .env 가 없고(optional) compose 가 환경변수로 주입한다 — 환경변수가 이 파일보다 우선한다.
    import: "optional:file:.env[.properties],optional:file:../../.env[.properties]"
  main:
    allow-bean-definition-overriding: true
  # Redis — 라이브러리는 auth-contract 가 api 로 노출한다(JwtProvider 의존).
  # 이 설정이 없으면 컨테이너 안에서 localhost:6379 로 접속을 시도한다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    hikari:
      maximum-pool-size: 20
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15433}/${DB_NAME:default}?schema=reservation"
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driverClassName: "org.postgresql.Driver"
  liquibase:
    enabled: true
    changeLog: /db/changelog/db.changelog-master.xml
    parameters:
      log-level: FINE
  docker:
    compose:
      # noinspection SpringBootApplicationYaml
      file: ./compose.yaml
  jackson:
    default-property-inclusion: NON_NULL
  threads:
    virtual: # 기본 Thread를 Virtual Thread 설정
      enabled: true

# Actuator — 런타임 로그레벨 토글(무재배포)에 사용. 응답 본문 로깅을 일시적으로 켜려면:
#   POST /actuator/loggers/com.media.bus.common.logging.AccessLoggingFilter  body={"configuredLevel":"DEBUG"}
#   원복: 같은 경로에 {"configuredLevel":"INFO"} (또는 null)
# 서비스 포트는 내부 Docker 네트워크 전용(expose)이라 외부 직접 접근 불가.
# host로 published 되는 서비스는 actuator 노출에 주의하거나 인증/방화벽으로 보호할 것.
management:
  endpoints:
    web:
      exposure:
        include: health, loggers
  endpoint:
    loggers:
      access: unrestricted # POST 레벨 변경 허용 (기본값이지만 명시)

hig:
  bulkhead:
    database-name: orderDatabase # resilience4j.bulkhead.instances 이름과 반드시 일치해야 함

resilience4j:
  bulkhead:
    instances:
      orderDatabase: # 벌크헤드 이름
        maxConcurrentCalls: 19 # 동시에 허용할 최대 호출 수 (세마포어 개수 1개는 여유분)
        maxWaitDuration: 200ms # 진입을 위해 기다릴 최대 시간 (초과 시 에러)

rest:
  service:
    apply-patterns: /health-check

# 정류소 선점(hold) 정책. 값을 바꾸면 이후 생성·전이되는 예약부터 적용된다.
reservation:
  hold:
    duration: 7d # 선점 유지 기간. 예약 시점과 상담 시작 시점에 이만큼 만료가 설정된다
    max-active-per-member: 100 # 회원 1명이 동시에 가질 수 있는 진행 중 예약 수
    gate-ttl: 5s # Redis 게이트 락 TTL (예약 1건의 S2S + DB 저장이 끝나기에 충분한 시간)
    occupied-cache-ttl: 30s # 예약 성공 후 게이트 키를 "점유됨" 캐시로 유지하는 시간
    expiry-interval: PT1M # 만료 스케줄러 주기 (ISO-8601)
    expiry-batch-size: 100 # 만료 스케줄러가 한 번에 처리하는 예약 수

jwt:
  secret: ${JWT_SECRET}

# 내부 서비스 URL — 운영환경 Docker 컨테이너명 기준
services:
  stop:
    url: ${STOP_SERVICE_URL:http://msa-stop:8182}
  iam:
    url: ${IAM_SERVICE_URL:http://msa-iam:8181}
springdoc:
  api-docs:
    path: /api-docs # OpenAPI JSON 문서 경로
  swagger-ui:
    path: /swagger-ui.html # Swagger UI 접속 경로
    groups-order: DESC # 그룹 표시 순서
    operations-sorter: method # API 정렬 기준 (method, alpha 등)
    disable-swagger-default-url: true # 기본 petstore URL 비활성화
    display-request-duration: true # API 응답 시간 표시
  show-actuator: true # Actuator 엔드포인트도 문서화할지 여부
