# 로컬 전체 스택 실행용 compose (모듈러 모놀리스).
# 운영 compose 와 같은 토폴로지를 유지하되 DB/Valkey/디버그 포트를 호스트에 노출한다.
#
# 앱을 IDE 에서 직접 띄울 때는 인프라만 올린다:
#   docker compose -f docker-compose-local.yml up -d database valkey

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  database:
    image: postgres:18.3
    container_name: msa-postgres
    environment:
      TZ: ${TZ:-Asia/Seoul}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?루트 .env에 POSTGRES_PASSWORD를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-default}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_HOST_PORT:-15433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  valkey:
    image: valkey/valkey:8.1.6
    container_name: msa-valkey
    environment:
      TZ: ${TZ:-Asia/Seoul}
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "${VALKEY_HOST_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  app:
    # ARM64 전용 이미지(Dockerfile 참고). x86 호스트에서도 arm64로 빌드·실행하도록 고정한다.
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bus-app
    logging: *default-logging
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
      - "${APP_DEBUG_PORT:-18080}:18080"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      JAVA_TOOL_OPTIONS: "-Duser.timezone=${TZ:-Asia/Seoul} -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:18080"
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-default}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?루트 .env에 POSTGRES_PASSWORD를 설정하세요}
      # 비밀값은 프로젝트 루트 .env 에서 읽는다(git 제외, .env.example 참고). 없으면 기동을 막는다.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 이 없습니다. 프로젝트 루트 .env 를 확인하세요}
      JWT_CLAIM_ENCRYPTION_KEY: ${JWT_CLAIM_ENCRYPTION_KEY:?JWT_CLAIM_ENCRYPTION_KEY 가 없습니다. 프로젝트 루트 .env 를 확인하세요}
      SEOUL_API_KEY: ${SEOUL_API_KEY:-}
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      # 관리자 사이트 origin. 비우면 CORS_ALLOWED_ORIGIN 과 같게 동작한다(로컬 단일 Next 앱).
      CORS_ADMIN_ALLOWED_ORIGIN: ${CORS_ADMIN_ALLOWED_ORIGIN:-}
      # 로컬 확인용 이미지 저장소(rustfs). 서버는 컨테이너 주소로, 브라우저 업로드 URL 은 호스트 주소로 만든다.
      # 운영 R2 의 CONTENT_STORAGE_* 는 넘기지 않는다. local 프로필은 LOCAL_CONTENT_STORAGE_* 만 읽는다.
      LOCAL_CONTENT_STORAGE_ENDPOINT: http://rustfs:9000
      LOCAL_CONTENT_STORAGE_PRESIGN_ENDPOINT: http://localhost:${RUSTFS_HOST_PORT:-9000}
      LOCAL_CONTENT_STORAGE_PUBLIC_BASE_URL: http://localhost:${RUSTFS_HOST_PORT:-9000}/bus-content
      LOCAL_CONTENT_STORAGE_ACCESS_KEY: ${LOCAL_CONTENT_STORAGE_ACCESS_KEY:-local-only-access-key}
      LOCAL_CONTENT_STORAGE_SECRET_KEY: ${LOCAL_CONTENT_STORAGE_SECRET_KEY:-local-only-secret-key}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      database:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # ───────────────────────────────────────────────────────────────────────────
  # [로컬 확인용 · 운영 미사용] 이미지 저장소 RustFS (S3 호환)
  #   운영은 Cloudflare R2 를 쓰며 docker-compose.yml 에는 이 서비스가 없다. 앱 이미지에도 포함되지 않는다.
  #   content 모듈의 이미지 업로드(presigned PUT) → 등록 → 화면 표시를 로컬에서 끝까지 확인하려고 둔다.
  #   MinIO 는 2025-10 커뮤니티 이미지 배포 중단으로 받을 수 없어 RustFS 를 쓴다.
  #   접속 키는 LOCAL_CONTENT_STORAGE_*(기본값은 로컬 전용 더미 값)이며 운영 CONTENT_STORAGE_* 와 분리돼 있다. 콘솔: http://localhost:9001
  #   실행: docker compose -f docker-compose-local.yml up -d database valkey rustfs rustfs-init
  # ───────────────────────────────────────────────────────────────────────────
  rustfs:
    image: rustfs/rustfs:1.0.6
    container_name: bus-rustfs-local
    environment:
      RUSTFS_ACCESS_KEY: ${LOCAL_CONTENT_STORAGE_ACCESS_KEY:-local-only-access-key}
      RUSTFS_SECRET_KEY: ${LOCAL_CONTENT_STORAGE_SECRET_KEY:-local-only-secret-key}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_REGION: us-east-1
    ports:
      - "${RUSTFS_HOST_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    logging: *default-logging

  # [로컬 확인용 · 운영 미사용] 버킷 bus-content 생성, 공개 읽기 정책, 브라우저 업로드 CORS 를 한 번 설정하고 끝난다.
  rustfs-init:
    image: amazon/aws-cli:2.42.2
    container_name: bus-rustfs-init-local
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: ${LOCAL_CONTENT_STORAGE_ACCESS_KEY:-local-only-access-key}
      AWS_SECRET_ACCESS_KEY: ${LOCAL_CONTENT_STORAGE_SECRET_KEY:-local-only-secret-key}
      AWS_DEFAULT_REGION: us-east-1
      CORS_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        S3="aws --endpoint-url http://rustfs:9000 s3api"
        for i in $$(seq 1 30); do $$S3 list-buckets >/dev/null 2>&1 && break; sleep 1; done
        $$S3 head-bucket --bucket bus-content 2>/dev/null || $$S3 create-bucket --bucket bus-content
        $$S3 put-bucket-policy --bucket bus-content --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::bus-content/*"]}]}'
        $$S3 put-bucket-cors --bucket bus-content --cors-configuration "{\"CORSRules\":[{\"AllowedOrigins\":[\"$$CORS_ORIGIN\"],\"AllowedMethods\":[\"GET\",\"PUT\"],\"AllowedHeaders\":[\"*\"],\"MaxAgeSeconds\":3600}]}"
        echo "bus-content 버킷 준비 완료"
    restart: "no"
    logging: *default-logging

volumes:
  postgres_data:
  valkey_data:
  rustfs_data: # 로컬 확인용 이미지 저장소
